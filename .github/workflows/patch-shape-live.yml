name: Patch shape live rendering
on:
  push:
    branches: [shape-live-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply targeted fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('frontend/src/pages/Classroom.jsx'); s=f.read_text()
          old='''  const onPointerMove = (event) => { const d = drawRef.current; if (!d) return; d.points.push(point(event)); if (["pen", "highlighter", "eraser"].includes(d.tool)) { const n = d.points.length; renderStroke({ ...d, points: [d.points[n - 2], d.points[n - 1]] }); queueLive(d, [d.points[n - 1]]); } else { const ctx = canvasRef.current?.getContext("2d"); if (ctx && drawBaseRef.current) ctx.putImageData(drawBaseRef.current, 0, 0); renderStroke(d); } };'''
          new='''  const onPointerMove = (event) => { const d = drawRef.current; if (!d) return; d.points.push(point(event)); if (["pen", "highlighter", "eraser"].includes(d.tool)) { const n = d.points.length; renderStroke({ ...d, points: [d.points[n - 2], d.points[n - 1]] }); queueLive(d, [d.points[n - 1]]); } else { const ctx = canvasRef.current?.getContext("2d"); if (ctx && drawBaseRef.current) ctx.putImageData(drawBaseRef.current, 0, 0); renderStroke(d); queueLive(d, [d.points[0], d.points[d.points.length - 1]]); } };'''
          if old not in s: raise SystemExit('pointer move target not found')
          s=s.replace(old,new,1)
          old='''            const fresh = Array.isArray(stroke.points) ? stroke.points : [];
            if (fresh.length) {
              const previous = live.points.length ? live.points[live.points.length - 1] : null;
              renderStroke({ ...live, points: previous ? [previous, ...fresh] : fresh });
              live.points.push(...fresh);
            }
            if (p.final) liveRef.current.delete(stroke.id);'''
          new='''            const fresh = Array.isArray(stroke.points) ? stroke.points : [];
            if (fresh.length) {
              if (["line", "arrow", "rect", "circle", "text", "sticky"].includes(stroke.tool)) {
                live.points = fresh.slice(-2);
                redraw();
                setTimeout(() => {
                  if (!committedRef.current.has(stroke.id) && slideRef.current === Number(p.page_number)) renderStroke(live);
                }, 0);
              } else {
                const previous = live.points.length ? live.points[live.points.length - 1] : null;
                renderStroke({ ...live, points: previous ? [previous, ...fresh] : fresh });
                live.points.push(...fresh);
              }
            }
            if (p.final) liveRef.current.delete(stroke.id);'''
          if old not in s: raise SystemExit('live render target not found')
          s=s.replace(old,new,1)
          f.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-shape-live.yml
          git add frontend/src/pages/Classroom.jsx
          git commit -m "fix: render live shapes without tracing"
          git push --force origin HEAD:shape-live-fix
