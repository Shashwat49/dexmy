name: Apply classroom slide sync fix
on:
  push:
    paths:
      - '.github/workflows/dexmy-slide-sync-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Classroom.jsx
        run: python .github/dexmy_slide_patch.py
      - name: Commit patched file via GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT repos/${{ github.repository }}/contents/frontend/src/pages/Classroom.jsx \
            -f message='fix: make teacher slide changes authoritative' \
            -f sha="$(gh api repos/${{ github.repository }}/contents/frontend/src/pages/Classroom.jsx --jq .sha)" \
            -f content="$(base64 -w0 frontend/src/pages/Classroom.jsx)"
# api commit path
