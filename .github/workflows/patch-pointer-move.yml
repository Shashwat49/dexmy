name: Patch shape pointer live
on:
  push:
    branches: [shape-live-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          f=Path('frontend/src/pages/Classroom.jsx'); s=f.read_text()
          old='''renderStroke(d); } };\n  const onPointerUp'''
          new='''renderStroke(d); queueLive(d, [d.points[0], d.points[d.points.length - 1]]); } };\n  const onPointerUp'''
          if old not in s: raise SystemExit('pointer target not found')
          f.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/patch-pointer-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Classroom.jsx
          git commit -m "fix: send only current shape endpoints while dragging"
          git push --force origin HEAD:shape-live-fix
