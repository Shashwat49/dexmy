name: Fix classroom page wiring
on:
  push:
    branches: [feature/classroom-page-ids-v2]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix identity-keyed rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/Classroom.jsx'); s=p.read_text()
          s=s.replace('(strokesByPageRef.current.get(pageAtStart) || []).forEach((s) => renderStroke(s));','(strokesByPageRef.current.get(currentPageId(pageAtStart)) || []).forEach((s) => renderStroke(s));')
          s=s.replace('const p = msg.pages || [{ page_number: 1, image_url: null }];\n          slidesRef.current = p;','const p = normalizePages(msg.pages);\n          slidesRef.current = p;')
          s=s.replace('strokesByPageRef.current.set(msg.page_number || 1, msg.canvas_json?.strokes || strokesByPageRef.current.get(msg.page_number || 1) || []);','strokesByPageRef.current.set(msg.page_id || currentPageId(msg.page_number || 1), msg.canvas_json?.strokes || strokesByPageRef.current.get(msg.page_id || currentPageId(msg.page_number || 1)) || []);')
          s=s.replace('publishControl({ kind: "slides", pages: updated, page_number: next });','publishControl({ kind: "slides", pages: updated, page_number: next, page_id: newPage.page_id });')
          s=s.replace('payload: { kind: "undo", page_number: slideRef.current }','payload: { kind: "undo", page_number: slideRef.current, page_id: currentPageId() }')
          s=s.replace('payload: { kind: "clear", page_number: slideRef.current }','payload: { kind: "clear", page_number: slideRef.current, page_id: currentPageId() }')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/pages/Classroom.jsx
          git commit -m 'fix: complete page-id classroom wiring' || true
          git push origin feature/classroom-page-ids-v2
