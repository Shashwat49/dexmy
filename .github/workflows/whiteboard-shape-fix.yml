name: Whiteboard shape fix
on:
  push:
    branches: [fix/whiteboard-shape-preview-final]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Classroom.jsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/pages/Classroom.jsx')
          t=p.read_text()
          t=t.replace('renderStroke(d); } };','renderStroke(d); queueLive(d, [d.points[0], d.points[d.points.length - 1]]); } };',1)
          t=t.replace('const queueLive = useCallback((stroke, points, final = false) => { const pending = pendingLiveRef.current; if (pending?.id === stroke.id) { pending.points.push(...points); pending.final = final; } else pendingLiveRef.current = { id: stroke.id, stroke: { id: stroke.id, tool: stroke.tool, color: stroke.color, width: stroke.width }, points: [...points], page_number: slideRef.current, final }; }, []);','const queueLive = useCallback((stroke, points, final = false) => { const pending = pendingLiveRef.current; const isShape = ["line", "arrow", "rect", "circle", "text", "sticky"].includes(stroke.tool); if (pending?.id === stroke.id) { if (isShape) pending.points = points.slice(-2); else pending.points.push(...points); pending.final = final; } else pendingLiveRef.current = { id: stroke.id, stroke: { id: stroke.id, tool: stroke.tool, color: stroke.color, width: stroke.width }, points: [...points], page_number: slideRef.current, final }; }, []);',1)
          t=t.replace('if (!d || !participant || room.state !== "connected" || !d.points?.length) return; const packet = { type: "whiteboard_checkpoint",','if (!d || !participant || room.state !== "connected" || !d.points?.length || !["pen", "highlighter", "eraser"].includes(d.tool)) return; const packet = { type: "whiteboard_checkpoint",',1)
          marker='if (p.page_number !== slideRef.current) {'
          s=t.index(marker); a=t.index('              const fresh = Array.isArray(stroke.points) ? stroke.points : []',s); b=t.index('              if (p.final) liveRef.current.delete(stroke.id);',a)
          t=t[:a]+'''              const fresh = Array.isArray(stroke.points) ? stroke.points : [];
              if (fresh.length) {
                if (["line", "arrow", "rect", "circle", "text", "sticky"].includes(stroke.tool)) live.points = fresh.slice(-2);
                else live.points.push(...fresh);
              }
'''+t[b:]
          s=t.index('            let live = liveRef.current.get(stroke.id);', t.index('if (msg.type === "whiteboard_live"'))
          a=t.index('            const fresh = Array.isArray(stroke.points) ? stroke.points : []',s); b=t.index('            if (p.final) liveRef.current.delete(stroke.id);',a)
          t=t[:a]+'''            const fresh = Array.isArray(stroke.points) ? stroke.points : [];
            if (fresh.length) {
              if (["line", "arrow", "rect", "circle", "text", "sticky"].includes(stroke.tool)) {
                live.points = fresh.slice(-2);
                redraw();
              } else {
                const previous = live.points.length ? live.points[live.points.length - 1] : null;
                renderStroke({ ...live, points: previous ? [previous, ...fresh] : fresh });
                live.points.push(...fresh);
              }
            }
'''+t[b:]
          needle='            if (!stroke?.id) return;'
          pos=t.index(needle, t.index('if (msg.type === "whiteboard_commit"'))
          insert_end=pos+len(needle)
          t=t[:insert_end]+'\n            if (pendingLiveRef.current?.id === stroke.id) pendingLiveRef.current = null;'+t[insert_end:]
          p.write_text(t)
          PY
          rm .github/workflows/whiteboard-shape-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/Classroom.jsx .github/workflows/whiteboard-shape-fix.yml
          git commit -m 'fix: eliminate live shape preview traces' || exit 0
          git push
