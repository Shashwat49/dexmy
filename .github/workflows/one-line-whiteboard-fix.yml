name: Apply one-line whiteboard fix

on:
  push:
    branches:
      - fix/whiteboard-no-redraw

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace exact whiteboard stroke handler line
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/Classroom.jsx')
          s = p.read_text()
          old = 'if (p.kind === "stroke" && p.stroke && p.page_number === slideRef.current) { const list = currentStrokes(); if (!list.some((s) => s.id === p.stroke.id)) list.push(p.stroke); redraw(); }'
          new = 'if (p.kind === "stroke" && p.stroke && p.page_number === slideRef.current) { const list = currentStrokes(); if (!list.some((s) => s.id === p.stroke.id)) { list.push(p.stroke); renderStroke(p.stroke); } }'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Commit exact change and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Classroom.jsx
          git rm .github/workflows/one-line-whiteboard-fix.yml
          git commit -m "Avoid full whiteboard redraw after stroke"
          git push