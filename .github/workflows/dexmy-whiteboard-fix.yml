name: Dexmy whiteboard fix

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/dexmy-whiteboard-fix.yml
      - .dexmy-whiteboard-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply whiteboard fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Frontend: prevent the same committed shape from being painted twice
          # when both the reliable LiveKit commit and websocket event arrive.
          p = Path('frontend/src/pages/Classroom.jsx')
          s = p.read_text()
          old = '''            const list = strokesByPageRef.current.get(pageNumber) || [];
            if (!list.some((s) => s.id === p.stroke.id)) list.push(p.stroke);
            strokesByPageRef.current.set(pageNumber, list);
            committedRef.current.add(p.stroke.id);
            liveRef.current.delete(p.stroke.id);
            if (pageNumber === slideRef.current) renderStroke(p.stroke);'''
          new = '''            const list = strokesByPageRef.current.get(pageNumber) || [];
            const isNewStroke = !list.some((s) => s.id === p.stroke.id);
            if (isNewStroke) list.push(p.stroke);
            strokesByPageRef.current.set(pageNumber, list);
            committedRef.current.add(p.stroke.id);
            liveRef.current.delete(p.stroke.id);
            if (isNewStroke && pageNumber === slideRef.current) renderStroke(p.stroke);'''
          if old not in s:
              raise SystemExit('frontend websocket stroke block not found')
          s = s.replace(old, new, 1)

          old = '''            const list = strokesByPageRef.current.get(pageNumber) || [];
            if (!list.some((s) => s.id === stroke.id)) list.push(stroke);
            strokesByPageRef.current.set(pageNumber, list);
            if (pageNumber === slideRef.current) renderStroke(stroke);'''
          new = '''            const list = strokesByPageRef.current.get(pageNumber) || [];
            const isNewStroke = !list.some((s) => s.id === stroke.id);
            if (isNewStroke) list.push(stroke);
            strokesByPageRef.current.set(pageNumber, list);
            if (isNewStroke && pageNumber === slideRef.current) renderStroke(stroke);'''
          if old not in s:
              raise SystemExit('frontend LiveKit commit block not found')
          s = s.replace(old, new, 1)

          old = '''          strokesByPageRef.current = new Map(p.map((x) => [x.page_number, []]));
          strokesByPageRef.current.set(msg.page_number || 1, msg.canvas_json?.strokes || []);'''
          new = '''          strokesByPageRef.current = new Map(p.map((x) => [x.page_number, Array.isArray(x.strokes) ? x.strokes : []]));
          strokesByPageRef.current.set(msg.page_number || 1, msg.canvas_json?.strokes || strokesByPageRef.current.get(msg.page_number || 1) || []);'''
          if old not in s:
              raise SystemExit('frontend state restore block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Backend: return the latest persisted strokes for EVERY page, not only
          # the currently selected/latest page. This lets reload restore the
          # complete multi-slide whiteboard state.
          p = Path('backend/app/websockets/classroom_ws.py')
          s = p.read_text()
          old = '''    pages = [
        {"page_number": n, "image_url": get_presigned_url(s.image_url, expires_in=3600) if s.image_url else None}
        for n, s in sorted(latest_by_page.items())
    ]'''
          new = '''    pages = [
        {
            "page_number": n,
            "image_url": get_presigned_url(s.image_url, expires_in=3600) if s.image_url else None,
            "strokes": (s.snapshot_data or {}).get("strokes", []),
        }
        for n, s in sorted(latest_by_page.items())
    ]'''
          if old not in s:
              raise SystemExit('backend pages block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git diff -- frontend/src/pages/Classroom.jsx backend/app/websockets/classroom_ws.py
      - name: Commit and clean up trigger files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Classroom.jsx backend/app/websockets/classroom_ws.py
          git add -u .github/workflows/dexmy-whiteboard-fix.yml .dexmy-whiteboard-fix-trigger || true
          git commit -m "fix: stabilize whiteboard shapes and restore all slide drawings" || exit 0
          git push origin HEAD:main
