name: Finalize classroom page model
on:
  push:
    branches: [feature/classroom-page-ids-v2]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden page ordering and PDF backgrounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Existing whiteboard snapshots have screenshot image keys, not PDF backgrounds.
          p=Path('backend/alembic/versions/20260915_classroom_page_identity.py'); s=p.read_text()
          s=s.replace('"t": "pdf" if latest else "whiteboard", "u": latest', '"t": "pdf" if isinstance(latest, str) and "annotate_" in latest else "whiteboard", "u": latest if isinstance(latest, str) and "annotate_" in latest else None')
          p.write_text(s)
          # PDF insertion must shift following positions from right to left to respect the unique position constraint.
          p=Path('backend/app/api/v1/endpoints/classroom.py'); s=p.read_text(); s=s.replace('for page in existing_pages:\n        if page.position > after_position: page.position += len(stored)', 'for page in reversed(existing_pages):\n        if page.position > after_position: page.position += len(stored)'); p.write_text(s)
          # Never expose a whiteboard recovery screenshot as its background; only PDF pages have a DOM background.
          p=Path('backend/app/websockets/classroom_ws.py'); s=p.read_text(); s=s.replace('key=snap.image_url if snap and snap.image_url else page.image_url', 'key=page.image_url if page.page_type == "pdf" else None'); p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend
          git commit -m 'fix: harden classroom page ordering and backgrounds' || true
          git push origin feature/classroom-page-ids-v2
